<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#162033" />
      <stop offset="50%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <linearGradient id="cometGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF9500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="30%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="livePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#FF2D55" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="7" />

  <!-- Speed Comet Acceleration Trails -->
  <path d="M110,380 C160,365 210,320 250,275 C270,250 285,230 300,210 C265,245 220,305 160,355 C135,375 118,382 110,380 Z" fill="url(#cometGrad)" opacity="0.85" />
  <path d="M130,410 C185,395 240,335 285,280 C310,250 330,225 345,195 C310,235 265,305 200,370 C165,405 140,415 130,410 Z" fill="url(#cometGrad)" opacity="0.95" />

  <!-- Dynamic Speed Streaks -->
  <line x1="120" y1="330" x2="200" y2="250" stroke="#FF3B30" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="150" y1="370" x2="240" y2="280" stroke="#FF9500" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <line x1="185" y1="410" x2="275" y2="320" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Live Orbit Arc & Beacon -->
  <path d="M190,180 C230,135 300,125 360,150 C410,170 440,220 435,275 C430,330 390,380 330,400 C280,415 220,395 180,355" fill="none" stroke="#FF3B30" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
  <circle cx="410" cy="195" r="16" fill="#FF3B30" opacity="0.3" filter="url(#glow)" />
  <circle cx="410" cy="195" r="9" fill="#FF3B30" />
  <circle cx="410" cy="195" r="4.5" fill="#FFFFFF" />

  <!-- The 3D Football (Soccer Ball) -->
  <ellipse cx="280" cy="245" rx="76" ry="76" fill="url(#ballGrad)" />
  <circle cx="280" cy="245" r="76" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6" />

  <!-- Pentagon Center -->
  <polygon points="280,215 306,234 296,264 264,264 254,234" fill="#0B111E" />

  <!-- Edge Pentagon Patches & Seam Connectors -->
  <polygon points="280,169 268,184 292,184" fill="#0B111E" />
  <polygon points="352,228 335,216 340,242" fill="#0B111E" />
  <polygon points="332,301 320,284 344,289" fill="#0B111E" />
  <polygon points="228,301 240,284 216,289" fill="#0B111E" />
  <polygon points="208,228 225,216 220,242" fill="#0B111E" />

  <!-- Ball Seam Lines -->
  <line x1="280" y1="215" x2="280" y2="184" stroke="#1E293B" stroke-width="2.5" />
  <line x1="306" y1="234" x2="335" y2="220" stroke="#1E293B" stroke-width="2.5" />
  <line x1="296" y1="264" x2="320" y2="284" stroke="#1E293B" stroke-width="2.5" />
  <line x1="264" y1="264" x2="240" y2="284" stroke="#1E293B" stroke-width="2.5" />
  <line x1="254" y1="234" x2="225" y2="220" stroke="#1E293B" stroke-width="2.5" />

  <!-- Specular 3D Reflection Gloss -->
  <path d="M250,200 C270,185 295,185 315,200 C295,192 270,192 250,200 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- "LIVE" Stadium Broadcast Pill Badge -->
  <rect x="186" y="420" width="140" height="36" rx="18" fill="url(#livePillGrad)" filter="url(#glow)" />
  <circle cx="212" cy="438" r="4.5" fill="#FFFFFF" />
  <text x="264" y="444" fill="#FFFFFF" font-family="'Cairo', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">LIVE</text>
</svg>

